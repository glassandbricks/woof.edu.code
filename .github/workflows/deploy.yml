name: Create and Share Scratch Frontend

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Scratch GUI builds best on Node 18 or 20

      - name: Install Dependencies
        run: npm ci # Uses package-lock.json for a clean, consistent install

      - name: Build Project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build # The directory where scratch-gui outputs compiled files
          branch: gh-pages # The branch the action will deploy to
